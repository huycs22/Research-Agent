[build-system]
requires = ["setuptools>=75", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-qa"
dynamic = ["version"]
description = "Local scientific research agent with cited evidence"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "aiohttp>=3.9,<4",
    "httpx>=0.27,<1",
    "langchain>=1.0,<2",
    "langchain-core>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "langchain-chroma>=1.0,<2",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
    "langsmith>=0.4,<1",
    "pydantic>=2.10,<3",
    "pymupdf>=1.25",
    "pypdf>=6",
    "python-dotenv>=1",
    "rank-bm25>=0.2",
    "tiktoken>=0.8",
    "uuid-utils==0.12.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
local = [
    "langchain-huggingface>=1.0,<2",
    "sentence-transformers>=5,<6",
]
benchmarks = [
    "huggingface-hub>=0.35",
    "pyarrow>=20",
]
dev = [
    "paper-qa[local,benchmarks]",
    "pytest>=8",
    "pytest-asyncio>=1",
    "ruff>=0.13",
]

[project.scripts]
pqa-ui = "paperqa.ui:main"
pqa-litqa = "paperqa.benchmarks.litqa:main"
pqa-deepresearch = "paperqa.benchmarks.deepresearch:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["ASYNC109", "B008", "E501", "RUF001", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.setuptools.package-data]
paperqa = ["py.typed", "ui/static/**"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
version_file = "src/paperqa/version.py"
